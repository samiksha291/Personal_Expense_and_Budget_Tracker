<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Monthly Budget</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="form-card">
    <h1>Set Monthly Budget</h1>

    <form id="budgetForm">
        <label for="month">Month</label>
        <input type="number"
               id="month"
               name="month"
               min="1"
               max="12"
               placeholder="Enter month (1-12)"
               required>

        <label for="year">Year</label>
        <input type="number"
               id="year"
               name="year"
               min="2020"
               placeholder="Enter year"
               required>

        <label for="amount">Budget Amount</label>
        <input type="number"
               id="amount"
               name="amount"
               step="0.01"
               min="0"
               placeholder="Enter budget amount"
               required>

        <button type="submit" id="submitBtn">
            Save Budget
        </button>
    </form>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>
</div>

<script src="js/budget.js"></script>

</body>
</html>
