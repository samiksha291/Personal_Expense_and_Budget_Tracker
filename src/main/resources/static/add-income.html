<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Income</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="header">
    <h1>💰 Personal Expense Manager</h1>
    <p>Add your income and keep your finances organized.</p>
</div>

<div class="container">
    <div class="form-card">
        <h1>💰 Add Income</h1>

        <form id="incomeForm">
            <label for="source">Source</label>
            <input type="text"
                   id="source"
                   name="source"
                   placeholder="Salary, Freelance, etc."
                   maxlength="100"
                   required>

            <label for="amount">Amount</label>
            <input type="number"
                   id="amount"
                   name="amount"
                   step="0.01"
                   min="0"
                   placeholder="Enter amount"
                   required>

            <label for="incomeDate">Date</label>
            <input type="date"
                   id="incomeDate"
                   name="incomeDate"
                   required>

            <label for="description">Description</label>
            <input type="text"
                   id="description"
                   name="description"
                   placeholder="Optional description"
                   maxlength="255">

            <button type="submit" id="submitBtn">
                Add Income
            </button>
        </form>

        <a class="back" href="dashboard.html">
            ← Back to Dashboard
        </a>
    </div>
</div>

<script src="js/income.js"></script>

</body>
</html>
