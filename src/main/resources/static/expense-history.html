<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expense History</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/expense-history.css">
</head>

<body>

<div class="expense-page">

    <div class="expense-header">
        <h1>Expense History</h1>
    </div>

    <!-- Search / Filter -->
    <div class="filter-card">
        <h2>Search / Filter Expenses</h2>

        <form id="filterForm">
            <div class="filter-row">
                <div class="filter-group">
                    <label>Category</label>
                    <select id="categoryId" name="categoryId">
                        <option value="">All</option>
                        <option value="1">Food</option>
                        <option value="2">Travel</option>
                        <option value="3">Shopping</option>
                        <option value="4">Bills</option>
                        <option value="5">Entertainment</option>
                        <option value="6">Healthcare</option>
                        <option value="7">Education</option>
                        <option value="8">Other</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Date</label>
                    <input type="date" id="expenseDate" name="expenseDate">
                </div>

                <div class="filter-group">
                    <label>Amount</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0">
                </div>

                <button type="submit" class="filter-button">
                    Search
                </button>

                <a href="expense-history.html" class="clear-button" id="clearBtn">
                    Clear
                </a>
            </div>
        </form>
    </div>

    <!-- Expense Table -->
    <div class="table-card">
        <table class="expense-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Category ID</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody">
                <tr>
                    <td colspan="5" style="text-align: center;">Loading expenses...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="expense-actions">
        <a href="add-expense.html">
            + Add Another Expense
        </a>
        <a href="dashboard.html">
            ← Back to Dashboard
        </a>
    </div>

</div>

<script>
    function loadExpenses(params = {}) {
        const query = new URLSearchParams();
        if (params.categoryId) query.append('categoryId', params.categoryId);
        if (params.expenseDate) query.append('expenseDate', params.expenseDate);
        if (params.amount) query.append('amount', params.amount);

        const url = '/api/expenses' + (query.toString() ? '?' + query.toString() : '');

        fetch(url)
            .then(res => res.json())
            .then(expenses => {
                const tbody = document.getElementById('expenseTableBody');
                tbody.innerHTML = '';

                if (!expenses || expenses.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: #64748b;">No expenses found.</td></tr>';
                    return;
                }

                expenses.forEach(exp => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${exp.expenseDate || '-'}</td>
                        <td>${exp.categoryId || '-'}</td>
                        <td>${exp.description || '-'}</td>
                        <td>&#8377;${Number(exp.amount).toFixed(2)}</td>
                        <td>
                            <a class="edit-link" href="edit-expense.html?expenseId=${exp.expenseId}">
                                Edit
                            </a>
                            <button type="button" class="delete-button" onclick="deleteExpense(${exp.expenseId})">
                                Delete
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error('Error loading expenses:', err);
                document.getElementById('expenseTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; color: red;">Failed to load expenses.</td></tr>';
            });
    }

    function deleteExpense(expenseId) {
        if (!confirm('Are you sure you want to delete this expense?')) return;

        fetch(`/api/expenses/${expenseId}`, {
            method: 'DELETE'
        })
        .then(res => {
            if (res.ok) {
                // Refresh list with current filter values
                triggerFilter();
            } else {
                alert('Failed to delete expense.');
            }
        })
        .catch(err => {
            console.error('Error deleting expense:', err);
            alert('An error occurred while deleting expense.');
        });
    }

    function triggerFilter() {
        const categoryId = document.getElementById('categoryId').value;
        const expenseDate = document.getElementById('expenseDate').value;
        const amount = document.getElementById('amount').value;

        loadExpenses({ categoryId, expenseDate, amount });
    }

    document.getElementById('filterForm').addEventListener('submit', function (e) {
        e.preventDefault();
        triggerFilter();
    });

    document.getElementById('clearBtn').addEventListener('click', function (e) {
        e.preventDefault();
        document.getElementById('categoryId').value = '';
        document.getElementById('expenseDate').value = '';
        document.getElementById('amount').value = '';
        loadExpenses();
    });

    // Initial load
    document.addEventListener('DOMContentLoaded', () => {
        loadExpenses();
    });
</script>

</body>
</html>
