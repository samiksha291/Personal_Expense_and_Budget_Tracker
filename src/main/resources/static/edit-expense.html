<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Expense</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/edit-expense.css">
</head>

<body>

<div class="edit-expense-page">

    <div class="edit-expense-header">
        <h1>Edit Expense</h1>
    </div>

    <div class="edit-expense-card">

        <form id="editExpenseForm" class="edit-form">

            <input type="hidden" id="expenseId" name="expenseId">

            <label for="categoryId">Category</label>
            <select id="categoryId" name="categoryId" required>
                <option value="1">Food</option>
                <option value="2">Travel</option>
                <option value="3">Shopping</option>
                <option value="4">Bills</option>
                <option value="5">Entertainment</option>
                <option value="6">Healthcare</option>
                <option value="7">Education</option>
                <option value="8">Other</option>
            </select>

            <label for="amount">Amount</label>
            <input type="number"
                   id="amount"
                   name="amount"
                   step="0.01"
                   min="0"
                   required>

            <label for="expenseDate">Date</label>
            <input type="date"
                   id="expenseDate"
                   name="expenseDate"
                   required>

            <label for="description">Description</label>
            <input type="text"
                   id="description"
                   name="description"
                   maxlength="255">

            <button type="submit" class="update-button" id="updateBtn">
                Update Expense
            </button>

        </form>

        <div class="edit-actions">
            <a href="expense-history.html">
                ← Back to Expense History
            </a>
            <a href="dashboard.html">
                Back to Dashboard
            </a>
        </div>

    </div>

</div>

<script src="js/expense.js"></script>

</body>
</html>
