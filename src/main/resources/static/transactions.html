<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Transaction History</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/transactions.css">
</head>

<body>

<div class="transactions-page">

    <div class="transactions-header">
        <h1>Transaction History</h1>
    </div>

    <div class="transactions-table-card">

        <table class="transactions-table">
            <thead>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Category / Source</th>
                <th>Description</th>
                <th>Amount</th>
            </tr>
            </thead>
            <tbody id="transactionTableBody">
            <tr>
                <td colspan="5" style="text-align: center; padding: 20px;">Loading transactions...</td>
            </tr>
            </tbody>
        </table>

    </div>

    <div class="transactions-actions">
        <a href="add-income.html">
            + Add Income
        </a>
        <a href="add-expense.html">
            + Add Expense
        </a>
        <a href="expense-history.html">
            Expense History
        </a>
        <a href="income-history.html">
            Income History
        </a>
        <a href="dashboard.html">
            ← Back to Dashboard
        </a>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/transactions')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('transactionTableBody');
                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: #64748b;">No transactions recorded.</td></tr>';
                    return;
                }

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.transactionDate || '-'}</td>
                        <td><strong>${item.type}</strong></td>
                        <td>${item.category || '-'}</td>
                        <td>${item.description || '-'}</td>
                        <td>&#8377;${Number(item.amount).toFixed(2)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error('Error loading transactions:', err);
                document.getElementById('transactionTableBody').innerHTML = 
                    '<tr><td colspan="5" style="text-align:center; color: red;">Failed to load transactions.</td></tr>';
            });
    });
</script>

</body>
</html>
