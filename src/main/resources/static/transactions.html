<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Transaction History</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/transactions.css">
</head>

<body>

<div class="transactions-page">

    <div class="transactions-header">
        <h1>Transaction History</h1>
    </div>

    <div class="transactions-table-card">

        <table class="transactions-table">
            <thead>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Category / Source</th>
                <th>Description</th>
                <th>Amount</th>
            </tr>
            </thead>
            <tbody id="transactionTableBody">
            <tr>
                <td colspan="5" style="text-align: center; padding: 20px;">Loading transactions...</td>
            </tr>
            </tbody>
        </table>

    </div>

    <div class="transactions-actions">
        <a href="add-income.html">
            + Add Income
        </a>
        <a href="add-expense.html">
            + Add Expense
        </a>
        <a href="expense-history.html">
            Expense History
        </a>
        <a href="income-history.html">
            Income History
        </a>
        <a href="dashboard.html">
            ← Back to Dashboard
        </a>
    </div>

</div>

<script src="js/transactions.js"></script>

</body>
</html>
